name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run renovate-config-validator
        uses: docker://ghcr.io/renovatebot/renovate:44.82.0@sha256:965b516ae9e7209610725b092fb09298fe6e240f242b6773e5852412f80adc5e
        with:
          args: renovate-config-validator --strict --no-global renovate-config.json

  workflows:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: docker://ghcr.io/jdx/jactionlint:2.6.0@sha256:323474d5999ac01a4712d99a8c21d245b62f79977a1e9cc8795f321142a087d7
        with:
          args: --online
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci:
    needs:
      - check
      - workflows

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Fail unless every job succeeded
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped'))
        run: exit 1
